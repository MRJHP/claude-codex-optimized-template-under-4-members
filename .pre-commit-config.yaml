# 설치: uv run pre-commit install
# 수동 실행: uv run pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy
        # `uv run mypy .`는 Windows에서 경로에 비ASCII 문자가 있으면 uv trampoline이
        # 스크립트 경로를 canonicalize하지 못해 실패한다. `python -m mypy`로 우회한다.
        entry: uv run python -m mypy .
        language: system
        types: [python]
        pass_filenames: false
