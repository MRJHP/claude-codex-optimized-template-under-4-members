name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: ruff
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      # 템플릿 상태(src/가 아직 없음)에서는 건너뛴다. 실제 프로젝트로 초기화된 뒤부터 적용된다.
      - name: mypy
        if: hashFiles('src/**/*.py') != ''
        run: uv run mypy .

      - name: pytest
        if: hashFiles('tests/**/*.py') != ''
        run: uv run pytest
